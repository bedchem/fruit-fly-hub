# The site is static: every page is a real file or a folder with an
# index.html in it. Anything else is a 404, answered with the site's own page.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    error_page 404 /404.html;
    location = /404.html { internal; }

    # scripts, styles and the connectome data (.bin) compress well
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml application/wasm application/octet-stream;

    location / {
        try_files $uri $uri/ =404;
    }

    # the TikTok pool is rewritten in place by the refresher: always revalidate
    location /pool/ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    # hashed build output never changes under the same name
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # models, connectome data and the Draco decoder keep their names across
    # deploys: cache for an hour, then revalidate against the ETag
    location ~ ^/(models|data|draco|skins|textures)/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600";
    }
}
